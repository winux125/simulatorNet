packages:
  - "packages/*"
  - "apps/*"

# pnpm blocks dependency build scripts by default. esbuild (pulled in by
# vitest/vite) needs its install script to link the platform-native binary.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.4'
  - react-dom@19.2.8
  - react@19.2.8
  - jose@6.2.4
