services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: simulatornet_test
      POSTGRES_USER: simulatornet
      POSTGRES_PASSWORD: simulatornet_test_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulatornet -d simulatornet_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
